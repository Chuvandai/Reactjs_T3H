<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* bai 1 2 3 */
      .wrapper {
        display: flex;
        align-items: start;
        gap: 20px;
      }
      h1 {
        display: flex;
        justify-content: center;
      }
      .container {
        width: 600px;
        border: 1px solid gray;
        padding: 20px;
      }
      p {
        display: flex;
        justify-content: center;
      }
      .img {
        box-sizing: border-box;
        border: 1px solid gray;

        display: flex;
        justify-content: center;
      }
      .img > img {
        width: 600px;
        height: 400px;
      }
      header {
        background-color: cadetblue;
      }
      nav ul {
        height: 45px;
        display: flex;
        align-items: center;
        list-style: none;
      }
      nav ul li {
        padding: 5px 10px;
      }
      nav ul li:hover {
        border-radius: 5px;
        background: gray;
      }
      nav ul li:active {
        border-radius: 5px;
        background: gray;
      }
      .content {
        width: 300px;
        border: 1px solid rgb(220, 217, 217);
        border-radius: 5px;
        padding: 20px;
        box-shadow: 0px 0px 5px gray;
      }
      .sp1 > img {
        width: 300px;
        height: 300px;
      }
      .bt {
        background: chartreuse;
        border: none;
        color: #fff;
        padding: 10px;
      }
      .price {
        color: gray;
      }

      /* bai4 */

      .box {
        background-color: gray;

        position: relative;
        height: 600px;
      }
      .item:first-child {
        position: absolute;
        top: 30%;
        left: 20%;
        background: forestgreen;
        padding: 0px 40px;
      }
      .item:nth-child(2) {
        position: absolute;
        top: 10%;
        left: 50%;

        background: forestgreen;
        padding: 0px 40px;
      }
      .item:nth-child(3) {
        position: absolute;
        top: 30%;
        right: 20%;

        background: forestgreen;
        padding: 0px 40px;
      }
      .item:nth-child(4) {
        position: absolute;
        left: 50%;
        bottom: 10%;

        background: forestgreen;
        padding: 0px 40px;
      }

      .item:nth-child(5) {
        position: absolute;
        bottom: 30%;
        left: 20%;

        background: forestgreen;
        padding: 0px 40px;
      }
      .item:nth-child(6) {
        position: absolute;
        bottom: 30%;
        right: 20%;

        background: forestgreen;
        padding: 0px 40px;
      }
      .item:nth-child(7) {
        position: absolute;
        top: 40%;
        left: 50%;

        background: forestgreen;
        padding: 0px 40px;
      }

      /* bai5 */
      .container1 {
        border: 2px solid gray;
        width: 980px;
        height: 520px;
      }
      .box8 {
        display: flex;
        justify-content: flex-end;
        border: 2px solid gray;
        width: 100%;
        height: 30px;
        margin-top: 6px;
      }
      .main-box {
        display: flex;
        gap: 20px;
        height: 450px;
        margin: 10px;
      }
      .box1 {
        border: 2px solid black;
        width: 350px;
        height: 200px;
      }
      .box2 {
        border: 2px solid black;
        width: 350px;
        height: 180px;
        margin-top: 10px;
      }

      .main {
        flex: 3;
        border: 2px solid black;
        padding: 20px;
      }

      .box3 {
        flex: 7;
        border: 2px solid black;
        padding: 20px;
      }
      .box2 > p {
        padding: 10px;
      }
    </style>
  </head>
  <body>

        <h3>Sản phẩm</h3>

        <p>

    </div>
    <div class="box">
      <div class="item">

      <div class="item">

      </div>
      <div class="item">

      </div>
      <div class="item">

      </div>
      <div class="item">

      </div>
      <div class="item">
        <h1>M6</h1>
      </div>
      <div class="item">

      </div>
      <br />
    </div>

    <div class="container1">
      <div class="box8">
        <button>create cv</button>
        <button>sign up</button>
      </div>
      <div class="main-box">

          <div class="box1">
            <h3>Free cv template</h3>
            <p>hahahahahahahaahahhahahahahahaha</p>
          </div>
          <div class="box2">
            <p>hahhaahhaahah</p>

        </div>
        <div class="box3"></div>
      </div>
    </div>
  </body>
</html>
