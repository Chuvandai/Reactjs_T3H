<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial; }
        .tab.active { border-bottom: 2px solid #2196f3; font-weight: bold; }
        .task.completed span { text-decoration: line-through; color: #888; }
        .delete-btn { color: red; cursor: pointer; }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">#todo</h1>
    <!-- Tabs -->
    <ul class="nav nav-tabs justify-content-center mb-3" id="todo-tabs">
        <li class="nav-item">
            <a class="nav-link active tab" data-tab="all" href="#">All</a>
        </li>
        <li class="nav-item">
            <a class="nav-link tab" data-tab="active" href="#">Active</a>
        </li>
        <li class="nav-item">
            <a class="nav-link tab" data-tab="completed" href="#">Completed</a>
        </li>
    </ul>
    <!-- Input area -->
    <div class="row justify-content-center mb-3">
        <div class="col-md-6">
            <div class="input-group">
                <input type="text" id="task-input" class="form-control" placeholder="add details">
                <button id="add-btn" class="btn btn-primary">Add</button>
            </div>
        </div>
    </div>
    <!-- Task list -->
    <div class="row justify-content-center">
        <div class="col-md-6">
            <ul class="list-group" id="task-list"></ul>
            <button class="btn btn-danger mt-3 w-100" id="delete-all-btn" style="display:none;">Delete all</button>
        </div>
    </div>
</div>
<script src="bai1.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
